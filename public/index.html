<style>
:root{--bg:#02070d;--br:2,7,13;--glow:#fb2f01;--ar:251,47,1;--glow2:#b32000;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);--f-body:Inter,system-ui,sans-serif;--f-head:'Poppins',system-ui,sans-serif;--f-hand:'Caveat Brush',cursive;--gs:linear-gradient(90deg,#f4f4f0 25%,#85857f 100%);--gh:linear-gradient(100deg,#9c9c95 0%,#f1f1ed 62%,#fff 100%)}

.card,.gcard{position:relative;aspect-ratio:16/9;border-radius:1.4vh;overflow:hidden;border:0;padding:0;background:#111;cursor:default;color:#fff;font-family:inherit;text-align:left;transition:filter .35s,transform .35s,box-shadow .35s}

/* footer */

  ['h-t'].forEach(function (id) { var el = $(id); if (el) el.addEventListener('click', tap); });
  addEventListener('keydown', function (e) { typed = (typed + (e.key || '')).toLowerCase().slice(-5); if (typed === 'admin') go(); });
})();

/* menu bar */
(function () {
  if (NV.on === false) return;
  var nv = $('nav'), html = document.documentElement, reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
  nv.style.display = ''; html.classList.add('has-nav'); if (NV.bg) nv.style.setProperty('--nav-c', NV.bg); nv.style.setProperty('--na', (NV.a == null ? 55 : NV.a) + '%'); nv.style.setProperty('--nb', (NV.b == null ? 18 : NV.b) + 'px');
  var targets = [];
  function go(u) {
    var id = u.slice(1), y = 0;
    if (id && id !== 'top') { var el = $(id); if (!el) return; y = el.getBoundingClientRect().top + window.pageYOffset - 96; }
    window.scrollTo({top: Math.max(0, y), behavior: reduced ? 'auto' : 'smooth'});
  }
  function link(cls, l, u) {
    var a = mk('a', cls, l); a.href = u;
    if (u.charAt(0) === '#') a.addEventListener('click', function (e) { e.preventDefault(); nv.classList.remove('open'); go(u); });
    else if (/^https?:/i.test(u)) { var o = ''; try { o = new URL(u).origin; } catch (x) {} if (o !== location.origin) { a.target = '_blank'; a.rel = 'noopener'; } }
    return a;
  }
  if (S1.logoOn !== false) {
    var lo = mk('a', 'nav-logo'), im = mk('img'); lo.href = '#top'; lo.setAttribute('aria-label', 'Back to top'); im.src = S1.logoId ? '/api/img/' + S1.logoId : '/logo.png'; im.alt = ''; im.draggable = false; lo.appendChild(im);
    lo.addEventListener('click', function (e) { e.preventDefault(); nv.classList.remove('open'); go('#top'); }); nv.appendChild(lo);
  }
  if (NV.name) { var nm = mk('a', 'nav-name', NV.name); nm.href = '#top'; nm.addEventListener('click', function (e) { e.preventDefault(); nv.classList.remove('open'); go('#top'); }); nv.appendChild(nm); }
  var box = mk('div', 'nav-links');
  (NV.links || []).forEach(function (l) {
    if (!l || !l.l || !l.u) return;
    if (l.u.charAt(0) === '#' && l.u.length > 1 && l.u !== '#top') { var el = $(l.u.slice(1)); if (!el || el.style.display === 'none') return; }
    var a = link('', l.l, l.u); box.appendChild(a); if (l.u.charAt(0) === '#') targets.push({a: a, id: l.u.slice(1)});
  });
  var hasLinks = !!box.children.length;
  if (hasLinks) nv.appendChild(box);
  var cta = NV.cta || {}; if (cta.l && cta.u) nv.appendChild(link('nav-cta', cta.l, cta.u));
  if (hasLinks) {
    var bg = mk('button', 'nav-burger'); bg.type = 'button'; bg.setAttribute('aria-label', 'Menu'); bg.appendChild(mk('i'));
    bg.onclick = function () { nv.classList.toggle('open'); }; nv.insertBefore(bg, nv.querySelector('.nav-cta') || null);
    document.addEventListener('click', function (e) { if (!nv.contains(e.target)) nv.classList.remove('open'); });
  }
  if (!nv.children.length) { nv.style.display = 'none'; html.classList.remove('has-nav'); }
  /* size follows the content: one row when it fits, a drop-down when it does not (or on phones) */
  function fit() { nv.classList.remove('compact', 'open'); if (window.innerWidth <= 760 || nv.scrollWidth > nv.clientWidth + 1) nv.classList.add('compact'); }
  fit(); addEventListener('resize', fit); addEventListener('load', fit); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  /* highlight the link of the section you are looking at */
  var tk = 0;
  function spy() {
    tk = 0; var cur = null, y = window.pageYOffset;
    targets.forEach(function (t) { var el = t.id && t.id !== 'top' ? $(t.id) : null; if (!el) { if (y < 200) cur = t; return; } if (el.getBoundingClientRect().top <= window.innerHeight * .35 && y >= 200) cur = t; });
    targets.forEach(function (t) { t.a.classList.toggle('on', t === cur); });
  }
  addEventListener('scroll', function () { if (!tk) tk = requestAnimationFrame(spy); }, {passive: true}); spy();
  /* "slots left" pill */
  var sl = NV.slots || {}; if (sl.on && sl.t) { var se = $('slots'), sp = mk('span'); sp.append(mk('i'), document.createTextNode(sl.t)); se.appendChild(sp); se.style.display = ''; html.classList.add('has-slots'); }
})();
}
/* loading screen: runs about 2 seconds (longer only if the site is slow), then fades away */
(function () {
  var p = document.getElementById('pre'); if (!p) return;
  var done = false, reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
  function hide() {
    if (done) return; done = true;
    setTimeout(function () {
      p.classList.add('out'); document.documentElement.classList.remove('is-pre');
      setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 600);
    }, Math.max(0, (reduced ? 400 : 2050) - performance.now()));
  }
  if (document.readyState === 'complete') hide(); else addEventListener('load', hide);
  setTimeout(hide, 5000);

/* image protection: no right-click menu or drag on pictures */
document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('img,.card,.gcard,.cmpstage,.about-ph,.logo')) e.preventDefault(); });
document.addEventListener('dragstart', function (e) { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });
/* visitor counter: one visit per browser session, a heartbeat while the tab is open (the admin preview is never counted) */
(function () {
  try { if (window.top !== window.self) return; } catch (e) { return; }
  var v = '', nw = 0, first = 0;
  try { v = localStorage.getItem('pf-vid') || ''; } catch (e) {}
  if (!/^[a-f0-9]{20}$/.test(v)) { v = ''; for (var i = 0; i < 20; i++) v += Math.floor(Math.random() * 16).toString(16); nw = 1; try { localStorage.setItem('pf-vid', v); } catch (e) {} }
  try { if (!sessionStorage.getItem('pf-sess')) { sessionStorage.setItem('pf-sess', '1'); first = 1; } } catch (e) { first = 1; }
  function ping(s) { try { fetch('/api/ping', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({v: v, s: s ? 1 : 0, n: s && nw ? 1 : 0}), keepalive: true}).catch(function () {}); } catch (e) {} }
  ping(first);
  setInterval(function () { if (!document.hidden) ping(0); }, 25000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) ping(0); });
})();
/* refreshing: draw the last known version immediately (no blank page, scroll position kept), then check for changes */
(function () {
  var CK = 'pf-data', rawOld = null, shown = false;
  try { rawOld = localStorage.getItem(CK); if (rawOld) { boot(JSON.parse(rawOld)); shown = true; } } catch (e) { shown = false; try { localStorage.removeItem(CK); } catch (x) {} }
  fetch('/api/data', {cache: 'no-cache'}).then(function (r) { return r.ok ? (r.text ? r.text() : r.json().then(JSON.stringify)) : null; }).then(function (txt) {
    if (txt === null) { if (!shown) boot({}); return; }
    try { localStorage.setItem(CK, txt); } catch (e) {}
    if (!shown) { var d = {}; try { d = JSON.parse(txt); } catch (e) {} boot(d); }
    else if (txt !== rawOld) location.reload();
  }).catch(function () { if (!shown) boot({}); });
})();
