<style>
:root{--bg:#02070d;--br:2,7,13;--glow:#fb2f01;--ar:251,47,1;--glow2:#b32000;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);--f-body:Inter,system-ui,sans-serif;--f-head:'Poppins',system-ui,sans-serif;--f-hand:'Caveat Brush',cursive;--gs:linear-gradient(90deg,#f4f4f0 25%,#85857f 100%);--gh:linear-gradient(100deg,#9c9c95 0%,#f1f1ed 62%,#fff 100%)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{background:var(--bg)}
html,body{margin:0;font-family:var(--f-body);color:#fff}
/* sliding wall */
.wall{position:relative;display:flex;flex-direction:column;gap:1.2vh;padding:1.2vh 0 0}
.row{height:31vh;height:31svh;flex:none;overflow:hidden;display:flex}
.track{display:flex;gap:1.2vh;height:100%;padding-right:1.2vh;width:max-content;animation:slide 70s linear infinite;will-change:transform}
.row:nth-child(2) .track{animation-direction:reverse;animation-duration:85s}
.row:nth-child(3) .track{animation-duration:62s}
.row.rv:not(.in) .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.card,.gcard{position:relative;aspect-ratio:16/9;border-radius:1.4vh;overflow:hidden;border:0;padding:0;background:#111;cursor:default;color:#fff;font-family:inherit;text-align:left;transition:filter .35s,transform .35s,box-shadow .35s}
.card{height:100%;flex:none}
.card img,.gcard img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.9);font:800 clamp(28px,7vh,80px)/1 var(--f-body);letter-spacing:-.03em}

/* selected work grid */
.work{position:relative;z-index:4;max-width:1400px;margin:0 auto;padding:clamp(56px,10vh,130px) 4vw}
.work h2{margin:0;font:500 clamp(34px,5.4vw,60px)/1.1 var(--f-head);letter-spacing:-.01em;color:var(--c-workT,#fff)}
.work p{margin:.6em 0 4vh;color:var(--c-workS,rgba(255,255,255,.6));font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px}
.gcard{border-radius:14px;border:1px solid rgba(255,255,255,.08)}
.gcard:hover,.gcard:focus-visible{transform:translateY(-5px);box-shadow:0 0 0 1px rgba(var(--ar),.7),0 14px 50px rgba(var(--ar),.25);outline:0}
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .25s}
.cap b{font-size:14px}.cap i{font-style:normal;font-size:12px;color:var(--glow)}
.gcard:hover .cap,.gcard:focus-visible .cap{opacity:1}
@media (hover:none){.cap{opacity:1}}
/* footer */
.stats{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:32px 40px;margin-bottom:5vh;text-align:left}
.stat b{display:block;color:var(--c-statN,#fff);border-left:3px solid var(--glow);padding-left:18px;font:600 clamp(48px,6.5vw,76px)/1.1 var(--f-body);letter-spacing:-.03em}
.stat span{display:block;margin-top:10px;padding-left:21px;color:var(--c-statL,rgba(255,255,255,.65));font-size:17px;line-height:1.5}
.stat em{font:400 1.2em/1.2 var(--f-hand);font-style:normal;color:var(--glow)}
.soc{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.soc a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:.6em 1.2em;border:1px solid rgba(255,255,255,.2);border-radius:999px;transition:border-color .2s,background .2s}
.soc a:hover,.soc a:focus-visible{border-color:var(--glow);background:rgba(var(--ar),.15);outline:0}
.hero{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 13vh) 4vw 8vh}
.tag{display:inline-flex;align-items:center;gap:9px;color:var(--glow);font:600 clamp(14px,1.5vw,17px)/1.3 Inter,system-ui,sans-serif}
.tag svg{flex:none;width:1.15em;height:1.15em}
.h1{margin:0;max-width:900px;font:600 clamp(38px,7.2vw,84px)/1.1 var(--f-head);letter-spacing:-.02em;color:var(--c-heroT,#fff);padding-bottom:.08em}
.hsub{margin:0;max-width:640px;color:var(--c-heroS,rgba(255,255,255,.82));font:400 clamp(15px,1.7vw,19px)/1.6 var(--f-head)}
.hero .stats{margin-top:4vh}
.hero .stats{margin:0}
.top{display:grid;place-items:center;width:52px;height:52px;padding:0;color:#fff;background:transparent;border:1px solid rgba(var(--ar),.6);border-radius:50%;cursor:pointer;box-shadow:0 0 20px rgba(var(--ar),.25);transition:background .2s}
.top:hover{background:rgba(var(--ar),.2)}
.top:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
@keyframes inL{from{opacity:0;transform:translateX(-9vw)}}
@keyframes inR{from{opacity:0;transform:translateX(9vw)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes glow{50%{text-shadow:0 0 56px rgba(var(--ar),.8)}}
.rv{opacity:0}
.rv.in{opacity:1;animation:rise .85s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.row.rv.in{animation-name:inL;animation-duration:1.15s}
.row.rv:nth-child(even).in{animation-name:inR}
.strip{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:36px 24px;max-width:1280px;margin:0 auto;padding:4vh 3vw 8vh}
@media (max-width:900px){.strip{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.strip{grid-template-columns:1fr}}
.big{border-left:3px solid var(--glow);padding-left:18px;font:600 clamp(40px,5.2vw,72px)/1.1 var(--f-body);letter-spacing:-.03em;white-space:nowrap}
.ca{color:var(--glow)}.cw{color:#fff}
.lab{margin-top:10px;padding-left:21px;color:rgba(255,255,255,.65);font-size:16px;line-height:1.5}
.lab em{font:400 1.2em/1.2 var(--f-hand);font-style:normal;color:var(--glow)}
.compare{max-width:1100px;margin:0 auto;padding:8vh 3vw 2vh}
.compare .cmp{box-shadow:0 30px 80px rgba(0,0,0,.5)}
.cmpstage{position:relative;padding:8% 9%;font-size:var(--fs,18px);--nc:#ffe14d}
.notes{position:absolute;inset:0;pointer-events:none;z-index:3}
.an{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%) rotate(var(--r));font:400 1em/1.1 var(--f-hand);color:#fff;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.75);opacity:0}
.an .ul{position:absolute;left:-3%;bottom:-.3em;width:106%;height:.45em;overflow:visible}
.an .ar{position:absolute;width:2.5em;height:2.5em;left:calc(50% + var(--dx) * (50% + 1.4em));top:calc(50% + var(--dy) * (50% + .95em));margin:-1.25em 0 0 -1.25em;transform:rotate(var(--rot));overflow:visible}
.an path{fill:none;stroke:var(--nc);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;vector-effect:non-scaling-stroke}
.an .ul path{stroke-width:3}
.notes.on .an{animation:anin .55s cubic-bezier(.2,.8,.2,1) calc(var(--i) * .3s) both}
.notes.on .an .ul path{animation:draw .6s ease calc(var(--i) * .3s + .35s) both}
.notes.on .an .ar path{animation:draw .55s ease calc(var(--i) * .3s + .6s) both}
.notes.edit .an{opacity:1;pointer-events:auto;cursor:grab;outline:1px dashed rgba(255,255,255,.4);outline-offset:6px;touch-action:none;user-select:none}
.notes.edit .an:active{cursor:grabbing}
.notes.edit .an path{stroke-dashoffset:0}
@keyframes anin{from{opacity:0;transform:translate(-50%,-20%) rotate(var(--r)) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r))}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.compare img,.cmp img,img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card img,.gcard img{pointer-events:none}
.card,.gcard,.cmpstage{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card::after,.gcard::after{content:"";position:absolute;inset:0;z-index:1}
.gcard .cap{z-index:2}
.bglow,.bgrid{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bglow{background:radial-gradient(ellipse 60% 45% at 50% -5%,rgba(var(--ar),.18),transparent 70%),radial-gradient(ellipse 45% 40% at 100% 70%,rgba(var(--ar),.07),transparent 70%);animation:breathe 9s ease-in-out infinite}
.bgrid{background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 35%,#000 25%,transparent 100%);mask-image:radial-gradient(ellipse 80% 70% at 50% 35%,#000 25%,transparent 100%);animation:gridmove 80s linear infinite}
html[data-grid=off] .bgrid,html[data-grid=off] .bglow{display:none}
@keyframes gridmove{to{background-position:64px 64px,64px 64px}}
@keyframes breathe{50%{opacity:.55}}
@media (max-width:700px){.bgrid{background-size:44px 44px}@keyframes gridmove{to{background-position:44px 44px,44px 44px}}}
.sechd{max-width:1100px;margin:0 auto;padding:8vh 4vw 0}
.sechd h2{margin:0;font:500 clamp(32px,5vw,56px)/1.1 var(--f-head);letter-spacing:-.01em;color:var(--c-secT,#fff)}
.sechd p{margin:.6em 0 0;color:var(--c-secS,rgba(255,255,255,.6));font-weight:500;line-height:1.5}
.foot{max-width:1100px;margin:0 auto;padding:8vh 4vw 9vh;text-align:center;border-top:1px solid rgba(255,255,255,.1)}
.foot h3{margin:0;font:500 clamp(32px,4.6vw,52px)/1.1 var(--f-head);letter-spacing:-.01em;color:var(--c-footT,#fff)}
.fsub{margin:.7em 0 0;color:var(--c-footS,rgba(255,255,255,.65));font-size:17px;line-height:1.5}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
.flinks a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:.65em 1.3em;border:1px solid rgba(255,255,255,.22);border-radius:999px;transition:border-color .2s,background .2s}
.flinks a:hover{border-color:var(--glow);background:rgba(var(--ar),.15)}
.fcopy{margin-top:34px;color:rgba(255,255,255,.45);font-size:13px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:clip}
a,button,.cmp{touch-action:manipulation}
@media (max-width:640px){.hero{gap:14px;padding-top:calc(env(safe-area-inset-top,0px) + 12vh)}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.cap{padding:22px 9px 8px}.cap b{font-size:12px}.cap i{font-size:11px}.compare{padding-top:6vh}.sechd{padding-top:6vh}}
@media (min-width:1600px){.wall{max-width:2400px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){.bgrid,.bglow{animation:none}}
@media (prefers-reduced-motion:reduce){.notes .an{opacity:1!important;animation:none!important}.notes .an path{stroke-dashoffset:0!important;animation:none!important}}
.cmp{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#111;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none;--p:50%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cmp .bf{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp .ln{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.cmp .hd{position:absolute;top:50%;left:var(--p);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.45);cursor:ew-resize}
.cmp .hd:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.track{animation-duration:400s!important}.hero *{animation:none!important}}
@media (max-width:700px){.wall{gap:.8vh}}

.h1{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

/* logo (top-left, fixed) */
.logo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:18px;z-index:6;display:block;width:clamp(38px,3.3vw,46px);aspect-ratio:1/1;border-radius:10px;line-height:0;transition:transform .3s cubic-bezier(.22,1,.36,1),filter .3s}
.logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:10px;pointer-events:none;-webkit-user-select:none;user-select:none}
.logo:hover,.logo:focus-visible{transform:scale(1.08);outline:0;filter:drop-shadow(0 0 12px rgba(var(--ar),.5))}
@keyframes logoIn{from{opacity:0;transform:scale(.7)}}
.logo{animation:logoIn .7s cubic-bezier(.2,.8,.2,1) .15s backwards}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
/* about */
.about{max-width:1180px;margin:0 auto;padding:clamp(48px,9vh,110px) 4vw}
.about-in{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,72px);align-items:center}
.about.nophoto .about-in{grid-template-columns:1fr;max-width:760px}
.about h2{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:var(--c-aboutT,var(--glow));font:500 clamp(22px,2.6vw,30px)/1.2 Inter,system-ui,sans-serif}
.about h2 svg{flex:none;width:1.05em;height:1.05em}
.about p{margin:0 0 1em;color:var(--c-aboutB,rgba(255,255,255,.62));font:400 clamp(15px,1.55vw,18px)/1.6 Inter,system-ui,sans-serif}
.about .talk{display:inline-flex;align-items:center;gap:10px;margin-top:10px;color:var(--c-aboutBtn,rgba(255,255,255,.7));text-decoration:none;font:500 16px Inter,system-ui,sans-serif;transition:color .2s}

.about .talk:hover,.about .talk:focus-visible{color:var(--c-aboutBtn,#fff);outline:0}.about .talk:hover{filter:brightness(1.25)}
.about .talk:hover svg{transform:translateX(4px)}
.about-ph{margin:0;overflow:hidden;border-radius:6px;aspect-ratio:1/1;background:#111}
.about-ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
@media (max-width:760px){.about-in{grid-template-columns:1fr}.about-ph{order:-1;max-width:420px}}
/* how it works */
.how{max-width:1280px;margin:0 auto;padding:clamp(48px,9vh,110px) 4vw;text-align:center}
.how .tag{margin-bottom:14px}
.shd{margin:0;font:500 clamp(32px,5vw,56px)/1.15 var(--f-head);letter-spacing:-.01em;color:#fff}
.how .shd{color:var(--c-howT,#fff)}.faq .shd{color:var(--c-faqT,#fff)}
.hero .tag{color:var(--c-heroTag,var(--glow))}.how .tag{color:var(--c-howTag,var(--glow))}.faq .tag{color:var(--c-faqTag,var(--glow))}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:clamp(32px,6vh,64px);text-align:left}
.step{display:flex;flex-direction:column;padding:26px 26px 30px;border:1px solid rgba(255,255,255,.08);border-radius:22px;background:rgba(255,255,255,.045);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.step .ic{display:grid;place-items:center;height:150px;color:var(--c-stepIcon,var(--glow))}
.step .ic svg{width:70px;height:70px;overflow:visible}
.step h3{margin:14px 0 10px;color:var(--c-stepT,rgba(255,255,255,.88));font:400 clamp(19px,1.9vw,23px)/1.25 var(--f-head)}
.step p{margin:0;max-width:22ch;color:var(--c-stepD,rgba(255,255,255,.5));font:400 15px/1.55 Inter,system-ui,sans-serif}
/* faq */
.faq{max-width:900px;margin:0 auto;padding:clamp(48px,9vh,110px) 4vw;text-align:center}
.faq .tag{margin-bottom:14px}
.faqs{margin-top:clamp(28px,5vh,56px);text-align:left}
.fq{border-bottom:1px solid rgba(255,255,255,.09)}
.fq:first-child{border-top:1px solid rgba(255,255,255,.09)}
.fq-q{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:24px 4px;background:none;border:0;color:var(--c-faqQ,rgba(255,255,255,.88));font:400 clamp(15px,1.7vw,18px)/1.4 Inter,system-ui,sans-serif;text-align:left;cursor:pointer;touch-action:manipulation}
.fq-q:hover{filter:brightness(1.2)}
.fq-q:focus-visible{outline:2px solid var(--glow);outline-offset:-2px;border-radius:6px}
.fq-q .pm{position:relative;flex:none;width:18px;height:18px;opacity:.65;transition:transform .3s,opacity .2s}
.fq-q .pm::before,.fq-q .pm::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:currentColor}
.fq-q .pm::after{transform:rotate(90deg)}
.fq.open .pm{transform:rotate(45deg);opacity:1}
.fq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.fq.open .fq-a{grid-template-rows:1fr}
.fq-a>div{overflow:hidden}
.fq-a p{margin:0;padding:0 40px 24px 4px;color:var(--c-faqA,rgba(255,255,255,.58));font:400 15.5px/1.7 Inter,system-ui,sans-serif;white-space:pre-line}
@media (prefers-reduced-motion:reduce){.fq-a,.fq-q .pm{transition:none}}

/* how-to-start animation */
.step{transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .35s,background .35s,box-shadow .45s;will-change:transform}
.step:hover{transform:translateY(-10px);border-color:rgba(var(--ar),.55);background:rgba(255,255,255,.06);box-shadow:0 22px 60px -18px rgba(var(--ar),.35)}
.step .ic svg{transition:transform .5s cubic-bezier(.22,1,.36,1),filter .4s}
.step:hover .ic svg{transform:scale(1.12) rotate(-4deg);filter:drop-shadow(0 0 14px rgba(var(--ar),.55))}
.step.rv.in{animation:stepIn .95s cubic-bezier(.22,1,.36,1) var(--d,0s) backwards}
.step.rv .ic svg path,.step.rv .ic svg circle{stroke-dasharray:1;stroke-dashoffset:1}
.step.rv.in .ic svg path,.step.rv.in .ic svg circle{animation:icdraw 1.1s cubic-bezier(.65,0,.35,1) calc(var(--d,0s) + .45s) forwards}
.step.rv.in .ic svg{animation:icpop .8s cubic-bezier(.34,1.56,.64,1) calc(var(--d,0s) + .35s) backwards}
.step.rv.in h3{animation:stxt .8s cubic-bezier(.22,1,.36,1) calc(var(--d,0s) + .55s) backwards}
.step.rv.in p{animation:stxt .8s cubic-bezier(.22,1,.36,1) calc(var(--d,0s) + .7s) backwards}
@keyframes stepIn{from{opacity:0;transform:translateY(70px) scale(.94);filter:blur(8px)}}
@keyframes icdraw{to{stroke-dashoffset:0}}
@keyframes icpop{from{opacity:0;transform:scale(.4) rotate(-14deg)}}
@keyframes stxt{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.step,.step .ic svg{transition:none}}
