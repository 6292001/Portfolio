<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thumbnails</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Inter:wght@500;600;800&display=swap">
<script>
function hexRgb(h) { return /^#[0-9a-f]{6}$/i.test(h || '') ? [1, 3, 5].map(function (k) { return parseInt(h.substr(k, 2), 16); }) : null; }
function toHex(c) { return '#' + c.map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join(''); }
function applyTheme(t) {
  var r = document.documentElement.style, a = hexRgb(t && t.accent) || [251, 47, 1], b = hexRgb(t && t.bg) || [2, 7, 13];
  r.setProperty('--glow', toHex(a)); r.setProperty('--ar', a.join(','));
  r.setProperty('--glow2', toHex(a.map(function (v) { return Math.round(v * .7); })));
  r.setProperty('--bg', toHex(b)); r.setProperty('--br', b.join(','));
}
try { applyTheme(JSON.parse(localStorage.getItem('pf-theme') || 'null')); } catch (e) {}
</script>
<style>
:root{--bg:#02070d;--br:2,7,13;--glow:#fb2f01;--ar:251,47,1;--glow2:#b32000;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#fff}
/* name mark */
.mark{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;z-index:6;display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:999px;background:rgba(var(--br),.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(var(--ar),.35);font-weight:800;font-size:15px;letter-spacing:-.01em}
.mark .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--glow),var(--glow2));font-weight:800}
.mark .av img{width:100%;height:100%;object-fit:cover}
/* sliding wall */
.wall{position:relative;display:flex;flex-direction:column;gap:1.2vh;padding:1.2vh 0 0}
.row{height:31vh;flex:none;overflow:hidden;display:flex}
.track{display:flex;gap:1.2vh;height:100%;padding-right:1.2vh;width:max-content;animation:slide 70s linear infinite;will-change:transform}
.row:nth-child(2) .track{animation-direction:reverse;animation-duration:85s}
.row:nth-child(3) .track{animation-duration:62s}
.row:hover .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.card,.gcard{position:relative;aspect-ratio:16/9;border-radius:1.4vh;overflow:hidden;border:0;padding:0;background:#111;cursor:default;color:#fff;font-family:inherit;text-align:left;transition:filter .35s,transform .35s,box-shadow .35s}
.card{height:100%;flex:none}
.card img,.gcard img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.9);font:800 clamp(28px,7vh,80px)/1 Inter,sans-serif;letter-spacing:-.03em}

/* selected work grid */
.work{position:relative;z-index:4;max-width:1400px;margin:0 auto;padding:12vh 4vw 12vh}
.work h2{margin:0;font:400 clamp(44px,8vw,88px)/1 'Caveat Brush',cursive;color:var(--glow);text-shadow:0 0 34px rgba(var(--ar),.45)}
.work p{margin:.6em 0 4vh;color:rgba(255,255,255,.6);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px}
.gcard{border-radius:14px;border:1px solid rgba(255,255,255,.08)}
.gcard:hover,.gcard:focus-visible{transform:translateY(-5px);box-shadow:0 0 0 1px rgba(var(--ar),.7),0 14px 50px rgba(var(--ar),.25);outline:0}
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .25s}
.cap b{font-size:14px}.cap i{font-style:normal;font-size:12px;color:var(--glow)}
.gcard:hover .cap,.gcard:focus-visible .cap{opacity:1}
@media (hover:none){.cap{opacity:1}}
/* footer */
.stats{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:32px 40px;margin-bottom:5vh;text-align:left}
.stat b{display:block;border-left:3px solid var(--glow);padding-left:18px;font:600 clamp(48px,6.5vw,76px)/1.1 Inter,system-ui,sans-serif;letter-spacing:-.03em}
.stat span{display:block;margin-top:10px;padding-left:21px;color:rgba(255,255,255,.65);font-size:17px;line-height:1.5}
.stat em{font:400 1.2em/1.2 'Caveat Brush',cursive;font-style:normal;color:var(--glow)}
.sig{font:400 clamp(44px,9vw,96px)/1 'Caveat Brush',cursive;color:var(--glow);text-shadow:0 0 34px rgba(var(--ar),.45)}
.role{margin-top:-10px;color:rgba(255,255,255,.65);font-weight:600;font-size:15px}
.soc{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.soc a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:.6em 1.2em;border:1px solid rgba(255,255,255,.2);border-radius:999px;transition:border-color .2s,background .2s}
.soc a:hover,.soc a:focus-visible{border-color:var(--glow);background:rgba(var(--ar),.15);outline:0}
.hero{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 14vh) 4vw 9vh}
.hero .sig{margin:0}
.hero .role{margin:-6px 0 4vh;font-size:clamp(15px,1.8vw,19px)}
.hero .stats{margin:0}
.top{display:grid;place-items:center;width:52px;height:52px;padding:0;color:#fff;background:transparent;border:1px solid rgba(var(--ar),.6);border-radius:50%;cursor:pointer;box-shadow:0 0 20px rgba(var(--ar),.25);transition:background .2s}
.top:hover{background:rgba(var(--ar),.2)}
.top:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
@keyframes inL{from{opacity:0;transform:translateX(-9vw)}}
@keyframes inR{from{opacity:0;transform:translateX(9vw)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes glow{50%{text-shadow:0 0 56px rgba(var(--ar),.8)}}
.mark{animation:pop .7s cubic-bezier(.2,.8,.2,1) .1s backwards}
.rv{opacity:0}
.rv.in{opacity:1;animation:rise .85s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.sig.rv.in{animation:rise .95s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards,glow 4.5s ease-in-out 1.3s infinite}
.row.rv.in{animation-name:inL;animation-duration:1.15s}
.row.rv:nth-child(even).in{animation-name:inR}
.strip{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:36px 24px;max-width:1280px;margin:0 auto;padding:4vh 3vw 14vh}
@media (max-width:900px){.strip{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.strip{grid-template-columns:1fr}}
.big{border-left:3px solid var(--glow);padding-left:18px;font:600 clamp(40px,5.2vw,72px)/1.1 Inter,system-ui,sans-serif;letter-spacing:-.03em;white-space:nowrap}
.ca{color:var(--glow)}.cw{color:#fff}
.lab{margin-top:10px;padding-left:21px;color:rgba(255,255,255,.65);font-size:16px;line-height:1.5}
.lab em{font:400 1.2em/1.2 'Caveat Brush',cursive;font-style:normal;color:var(--glow)}
.compare{max-width:1000px;margin:0 auto;padding:10vh 4vw 4vh}
.compare .cmp{box-shadow:0 30px 80px rgba(0,0,0,.5)}
.cmp{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#111;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none;--p:50%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cmp .bf{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp .ln{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.cmp .hd{position:absolute;top:50%;left:var(--p);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.45);cursor:ew-resize}
.cmp .hd:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.track{animation-duration:400s!important}.hero *,.mark{animation:none!important}}
@media (max-width:700px){.wall{gap:.8vh}}

.mark,.sig{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div class="mark" id="mark"></div>
<header class="hero">
<h1 class="sig" id="sig"></h1>
<div class="role" id="role"></div>
<div class="stats" id="stats"></div>
</header>
<main class="wall" id="wall" aria-label="Thumbnail designs"></main>
<section class="compare" id="compare"><div class="cmp" id="cmp"></div></section>
<section class="work">
<h2>Selected work</h2>
<p>A few of my favourites.</p>
<div class="grid" id="grid"></div>
</section>
<section class="strip" id="strip" aria-label="Highlights"></section>
<script>
function $(i) { return document.getElementById(i); }
function mk(t, c, tx) { var e = document.createElement(t); if (c) e.className = c; if (tx != null) e.textContent = tx; return e; }
function boot(RAW) {

function x(v) { return String(v).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var DATA = RAW || {};
var S0 = {name: 'Shehroz Khan', role: 'Thumbnail designer', stats: [{v: '50M+', l: 'Clicks generated', n: ''}, {v: '100+', l: 'Clients worked with globally', n: ''}, {v: '100%', l: 'Satisfied clients', n: 'every single time :)'}]}, S1 = DATA.site || {};
var SITE = {name: S1.name || S0.name, role: S1.role || S0.role, stats: S1.stats || S0.stats, avatar: S1.avatarId ? '/api/img/' + S1.avatarId : '', theme: S1.theme || {accent: '#fb2f01', bg: '#02070d'}};
var NAME = SITE.name, ROLE = SITE.role;
var AVATAR = SITE.avatar || '';
var THUMBS = (DATA.thumbs || []).map(function (t) { return {src: '/api/img/' + t.id, title: t.title, stat: t.stat, feat: t.feat}; });
applyTheme(SITE.theme); try { localStorage.setItem('pf-theme', JSON.stringify(SITE.theme)); } catch (e) {}
/* ====================== */
document.title = NAME + ' | Thumbnail designs';
var N = THUMBS.length || 12, items = [], cur = 0;
for (var i = 0; i < N; i++) {
  var t = THUMBS[i] || {}; if (typeof t === 'string') t = {src: t};
  var h = (i * 47 + 190) % 360;
  items.push({src: t.src || null, title: t.title || (t.src ? '' : 'Thumbnail ' + (i + 1)), stat: t.stat || '', feat: !!t.feat, n: i + 1,
    bg: 'linear-gradient(135deg,hsl(' + h + ',75%,45%),hsl(' + ((h + 50) % 360) + ',80%,22%))'});
}
function inner(it) { return it.src ? '<img src="' + it.src + '" alt="' + x(it.title || 'Thumbnail ' + it.n) + '" loading="lazy">' : '<div class="ph" style="background:' + it.bg + '">' + it.n + '</div>'; }
function tile(i, cls, cap) {
  var it = items[i], b = document.createElement('div');
  b.className = cls;
  b.innerHTML = inner(it) + (cap && (it.title || it.stat) ? '<span class="cap"><b>' + x(it.title) + '</b>' + (it.stat ? '<i>' + x(it.stat) + '</i>' : '') + '</span>' : '');
  return b;
}
function rowGroup(r, n) { var a = Math.floor(r * n / 3), b = Math.floor((r + 1) * n / 3), g = []; for (var k = a; k < b; k++) g.push(k); return g.length ? g : [r % n]; }
var wall = document.getElementById('wall'), cw = innerHeight * .31 * 16 / 9 + innerHeight * .012, speeds = [55, 45, 65];
for (var r = 0; r < 3; r++) {
  var row = document.createElement('div'); row.className = 'row';
  var track = document.createElement('div'); track.className = 'track';
  var g = rowGroup(r, N), reps = Math.max(1, Math.ceil(innerWidth * 1.2 / (g.length * cw)));
  for (var d = 0; d < 2; d++) for (var p = 0; p < reps; p++) g.forEach(function (ix) { track.appendChild(tile(ix, 'card')); });
  track.style.animationDuration = Math.round(reps * g.length * cw / speeds[r]) + 's';
  row.appendChild(track); wall.appendChild(row);
}
var grid = document.getElementById('grid');
var fi = []; items.forEach(function (it, ix) { if (it.feat) fi.push(ix); });
if (!fi.length) for (var q0 = 0; q0 < Math.min(N, 10); q0++) fi.push(q0);
fi.slice(0, 20).forEach(function (ix) { grid.appendChild(tile(ix, 'gcard', true)); });
var STRIP0 = [{v: '6', t: 'Years active', d: 'Fiverr & Upwork since 2018', s: 'w'}, {v: '800+', t: 'Creators served', d: 'Every niche imaginable', s: 'w'}, {v: '12%', t: 'Avg CTR', d: 'Platform average is 2\u20134%', s: 'w'}, {v: '48H', t: 'Delivery', d: 'Fast. Never compromise.', s: 'w'}];
var cells = (Array.isArray(S1.strip) ? S1.strip : STRIP0).filter(function (c) { return c && (c.v || c.t || c.d); });
if (!cells.length) $('strip').style.display = 'none';
else {
  $('strip').style.setProperty('--n', Math.min(cells.length, 4));
  cells.forEach(function (c) {
    var m = /^([\d.,]+)(.*)$/.exec(c.v || ''), num = m ? m[1] : '', suf = m ? m[2] : (c.v || ''), st = c.s || 'w';
    var cell = mk('div', 'cell'), big = mk('div', 'big'), lab = mk('div', 'lab', c.t || '');
    big.append(mk('span', 'n ' + (st === 'a' || st === 'na' ? 'ca' : 'cw'), num), mk('span', 'sf ' + (st === 'a' || st === 'sa' ? 'ca' : 'cw'), suf));
    if (c.d) { lab.appendChild(document.createTextNode(' ')); lab.appendChild(mk('em', 0, c.d)); }
    cell.append(big, lab); $('strip').appendChild(cell);
  });
}
function makeCompare(box, before, after) {
  var af = mk('img'), bf = mk('img', 'bf'), ln = mk('div', 'ln'), hd = mk('div', 'hd'), cur = 50, dragging = false, anim = 0;
  af.src = after; bf.src = before; af.alt = bf.alt = ''; af.draggable = bf.draggable = false;
  hd.tabIndex = 0; hd.setAttribute('role', 'slider'); hd.setAttribute('aria-label', 'Before and after comparison');
  hd.setAttribute('aria-valuemin', '0'); hd.setAttribute('aria-valuemax', '100');
  hd.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>';
  box.innerHTML = ''; box.append(af, bf, ln, hd);
  function set(p) { cur = Math.max(0, Math.min(100, p)); box.style.setProperty('--p', cur + '%'); hd.setAttribute('aria-valuenow', Math.round(cur)); }
  function fromX(x) { var r = box.getBoundingClientRect(); if (r.width) set((x - r.left) / r.width * 100); }
  box.addEventListener('pointerdown', function (e) { cancelAnimationFrame(anim); dragging = true; try { box.setPointerCapture(e.pointerId); } catch (x) {} fromX(e.clientX); });
  box.addEventListener('pointermove', function (e) { if (dragging) fromX(e.clientX); });
  ['pointerup', 'pointercancel'].forEach(function (ev) { box.addEventListener(ev, function () { dragging = false; }); });
  hd.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowLeft' ? -4 : e.key === 'ArrowRight' ? 4 : 0;
    if (d) { e.preventDefault(); set(cur + d); }
  });
  box.sweep = function () {
    cancelAnimationFrame(anim); var t0 = performance.now();
    (function f(t) { var k = Math.min(1, (t - t0) / 2200); set(50 + 26 * Math.sin(k * Math.PI * 2)); if (k < 1) anim = requestAnimationFrame(f); else set(50); })(t0);
  };
  set(50);
}
var cmpd = S1.compare || {};
if (cmpd.beforeId && cmpd.afterId) makeCompare($('cmp'), '/api/img/' + cmpd.beforeId, '/api/img/' + cmpd.afterId); else $('compare').style.display = 'none';
/* identity */
document.getElementById('mark').innerHTML = '<span class="av">' + (AVATAR ? '<img src="' + AVATAR + '" alt="">' : NAME.charAt(0).toUpperCase()) + '</span>' + x(NAME);
document.getElementById('sig').textContent = NAME;
document.getElementById('role').textContent = ROLE;
SITE.stats.forEach(function (st) { if (!st.v && !st.l) return; var d = mk('div', 'stat'), p = mk('span', 0, st.l || ''); if (st.n) { p.appendChild(document.createTextNode(' ')); p.appendChild(mk('em', 0, st.n)); } d.append(mk('b', 0, st.v || ''), p); $('stats').appendChild(d); });
/* motion: replays every time an element scrolls back into view */
(function () {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches || !('IntersectionObserver' in window)) return;
  function cnt(el, on) {
    var b = el.querySelector('b, .n'); if (!b) return;
    var f = b.dataset.f || (b.dataset.f = b.textContent), m = /^(\d[\d,]*(?:\.\d+)?)(.*)$/.exec(f);
    clearTimeout(b._t); cancelAnimationFrame(b._r);
    if (!m) return;
    if (!on) { b.textContent = f; return; }
    var end = parseFloat(m[1].replace(/,/g, '')), dec = (m[1].split('.')[1] || '').length, suf = m[2], comma = m[1].indexOf(',') >= 0;
    function fmt(v) { v = v.toFixed(dec); return comma ? Number(v).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}) : v; }
    b.textContent = fmt(0) + suf;
    b._t = setTimeout(function () { var t0 = performance.now(); (function g(t) { var p = Math.min(1, (t - t0) / 1700); b.textContent = fmt(end * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) b._r = requestAnimationFrame(g); })(t0); }, 500 + (+el.dataset.i || 0) * 150);
  }
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { var on = e.isIntersecting; e.target.classList.toggle('in', on); if (e.target.classList.contains('stat') || e.target.classList.contains('cell')) cnt(e.target, on);
      if (on && e.target.sweep) e.target.sweep(); }); }, {threshold: .1});
  function rv(el, d) { el.classList.add('rv'); el.style.setProperty('--d', d + 's'); io.observe(el); }
  rv($('sig'), .1); rv($('role'), .3);
  [].forEach.call(document.querySelectorAll('.stat'), function (el, i) { el.dataset.i = i; rv(el, .5 + i * .15); });
  [].forEach.call(document.querySelectorAll('.row'), function (el, i) { rv(el, i * .15); });
  [].forEach.call(document.querySelectorAll('.cmp'), function (el) { rv(el, 0); });
  [].forEach.call(document.querySelectorAll('.cell'), function (el, i) { el.dataset.i = i; rv(el, i * .12); });
  [].forEach.call(document.querySelectorAll('.work h2, .work p'), function (el, i) { rv(el, i * .12); });
  [].forEach.call(document.querySelectorAll('.gcard'), function (el, i) { rv(el, (i % 4) * .1); });
})();
/* cursor effects */
/* hidden way to the admin page: tap the badge or the big name 5 times, or type "admin" */
(function () {
  var taps = [], typed = '';
  function go() { location.href = '/admin'; }
  function tap() { var n = Date.now(); taps = taps.filter(function (x) { return n - x < 3000; }); taps.push(n); if (taps.length >= 5) go(); }
  ['mark', 'sig'].forEach(function (id) { var el = $(id); if (el) el.addEventListener('click', tap); });
  addEventListener('keydown', function (e) { typed = (typed + (e.key || '')).toLowerCase().slice(-5); if (typed === 'admin') go(); });
})();
}
fetch('/api/data', {cache: 'no-cache'}).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }).then(boot);
</script>
</body>
</html>
